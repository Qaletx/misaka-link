name: Build macOS universal app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/build-macos.yml'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  VITE_API_URL: ${{ vars.MISAKA_API_URL }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download sing-box cores
        shell: bash
        run: |
          mkdir -p core
          core_tmp="$(mktemp -d)"
          mkdir -p "$core_tmp/amd64" "$core_tmp/arm64"
          curl -L --fail -o "$core_tmp/amd64.tar.gz" https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-darwin-amd64-legacy-macos-10.13.tar.gz
          tar -xzf "$core_tmp/amd64.tar.gz" --strip-components=1 -C "$core_tmp/amd64"
          cp "$core_tmp/amd64/sing-box" core/sing-box-amd64
          curl -L --fail -o "$core_tmp/arm64.tar.gz" https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-darwin-arm64.tar.gz
          tar -xzf "$core_tmp/arm64.tar.gz" --strip-components=1 -C "$core_tmp/arm64"
          cp "$core_tmp/arm64/sing-box" core/sing-box-arm64
          chmod +x core/sing-box-amd64 core/sing-box-arm64
      - name: Build universal DMG
        run: npm run dist:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qaletx-link-macos-universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
